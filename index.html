<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head>
<body>
    <header>
        <div class="heading">
            <svg xmlns="http://www.w3.org/2000/svg" x="0px" y="0px" width="30" height="30" viewBox="0 0 50 50" style="fill:#8b5cf6;">
                <path d="M 25 2 C 12.317 2 2 12.317 2 25 C 2 37.683 12.317 48 25 48 C 37.683 48 48 37.683 48 25 C 48 20.44 46.660281 16.189328 44.363281 12.611328 L 42.994141 14.228516 C 44.889141 17.382516 46 21.06 46 25 C 46 36.579 36.579 46 25 46 C 13.421 46 4 36.579 4 25 C 4 13.421 13.421 4 25 4 C 30.443 4 35.393906 6.0997656 39.128906 9.5097656 L 40.4375 7.9648438 C 36.3525 4.2598437 30.935 2 25 2 z M 43.236328 7.7539062 L 23.914062 30.554688 L 15.78125 22.96875 L 14.417969 24.431641 L 24.083984 33.447266 L 44.763672 9.046875 L 43.236328 7.7539062 z"></path>
            </svg>
            <h1>TaskNet</h1>
        </div>

        <div class="sentence">
            <p>Organize your tasks and get things done.</p>
            <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABgAAAAYCAYAAADgdz34AAAACXBIWXMAAAsTAAALEwEAmpwYAAAB4UlEQVR4nOVVy0ocURBtIcFNHruIm2RlYhI3gguzknyEkLGqgyhklx8wggsfTFdNQiZIGBcK+QEJcZH8Qcgq+EjEPxBBQzJWdZuoV2qme9JpBGdMDy48UNDcOvecqlv30p53KcCoKwT6oS3iJX+/n1GdReDLQO4GDPIuMbDvfMWx2kcoh4zypxEQPchFvDi8d5NQvlnlBFpm1Df1LnTDcv8lXipEvQS6XhNHXQvG3PUyuBsm3liD6F7rwn50l1ErBPK7Ua2vt5M8j+gdBvle76rGqdiepsQJZIlBjuoV2rlrxao+9ehAF2KODf6IURbPNGDQ1b+3RXcCCMec5zqyPFtjDMeN0+Cjfj3ToPzcdRKGo/8YoS7PD7trCce+GfR9qpBV22N7mzqmpMISaIFQd2ORj1ND7srCM3eVQD/FQ941zmkdNg0bHqFux9f0BaNOxuLbQSHq8fJAMBI+JpRjQtE4jgNfh7I8RpkhkOlzmTDqcnom2fwr2O9mkF+E8vP1k2pXywbk66PE4CXIYDpngoz6JckT6mfG6q3zdLFikVmbJNAfqe6S2AtAJ1o2ycIeIqMcZA1qLxz0rZcHSrWbJpsp8S37f3h5ouhH9xkkJJCo+LT60GsHCGSOUGbbIn7hOAFTD5MZdQ41jwAAAABJRU5ErkJggg==" alt="bard--v1">
        </div>
    </header>

    <main>
        <section class="to-add">
            <input type="search" placeholder="Search tasks..." id="myText" class="myInput">
            <button class="add" id="myBtn">+ Add</button>
        </section>

        <div class="btn-bar">
            <button class="all" data-status="all">All</button>
            <button class="other" data-status="pending">Pending</button>
            <button class="other" data-status="in-progress">In Progress</button>
            <button class="other" data-status="completed">Completed</button>
            <select name="filter-p" id="filter-p" class="filter-p">
                <option value="all">All Priorities</option>
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
            </select>
            <button class="clearbtn" id="clearBtn">
                <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABgAAAAYCAYAAADgdz34AAAACXBIWXMAAAsTAAALEwEAmpwYAAAAi0lEQVR4nGNgGBHgvbNzw3sXl//I+J2zcwdZhr1zcTmFbth7IvE7Z+cTxFhwklwL3js7H2cYGeA9mUHEMCgt+ODsbPrR1dUc3TBs4mRZwIDDV/jUjlrwf9QChlELCAKUHOvkZPbGxcUCIydjESfFgsckl0XOzo+ItuCtk5MnSAMphr91dvYg2oIhBQDZ7v+yHqqS4AAAAABJRU5ErkJggg==" alt="trash">
                Clear Completed
            </button>
        </div>

        <section>
            <form action="" id="taskForm">
                <h3>Add Task</h3>
                <div>
                    <label for="taskTitle">Task Title</label>
                    <input type="text" id="taskTitle" placeholder="Enter task title..." class="inputTask">
                </div>

                <div>
                    <label for="description">Task Description</label>
                    <textarea id="description" placeholder="Enter task description..." class="inputTask"></textarea>
                </div>

                <div class="date-field" id="dateField">
                    <label for="dueDate">Due Date</label>
                    <input type="text" id="dueDate" class="date-input" placeholder="mm/dd/yyyy">
                    <button class="date-icon">
                        <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADAAAAAwCAYAAABXAvmHAAAACXBIWXMAAAsTAAALEwEAmpwYAAAB4ElEQVR4nO2ZwUoDMRCGA0ofQ++9asGZKj5F30IR9NbJsq8g4iMoelKpJ6tvU/WymT2oR9mVKWp3W23ZTdO0kA9yKvtn/mQy2c4qFQgEAksPtdNdDeaagF80mE+NnDsZMNR+JjRX0Q63rQOP9/N1jXzuLGCcZYjPJIbaBrwGjyMT9dOmLHQX7SZbcTNvKEfEzbzRxWRbg+mN5jYZAWNlMcn5Qm72nEQ8BY188zM/oblUVRke2G8BWXm1YLqyE78GeFBZoFhtXKbNf8icxeqkqlLMf+UJbROD9+qD5REM6FU2oDyhgwEMBpbTAEG6SchPGvhDIz/G7XRj4nkwRxr4VQahOaylga4MyMSF3wm4X/w9wnSvXEVMJi+HVTQc7wC/lwIEfis9C3wyXgYJ+biKhlMDsuXTVm/iVRxNNv4Pa5aG+zMA3B+uIvDDX/kreS9vtDKitjmoo6FDFcJgwAodDKC7i8yvAbS/yPwaAPuLzKsBPYeLzKsBmsNF5t4ArHhbhTw3tiJIWlaNLWlxjwTMvZMop0DIt4UduFBVkUNXrjSmJ6viurkbQdKSBSsVAGSoJSit7fFyuOhByKd2Hzi8mTCZBN/p5GvKFunPS4tbDpPrT0yEPJC5aqdNIBAIqEXyBVjmIm4158o4AAAAAElFTkSuQmCC" alt="calendar--v1">
                    </button>
                    <div class="picker" id="picker">
                        <div class="picker-head">
                            <button type="button" class="dp-nav" id="prev">‹</button>
                            <span class="date" id="date"></span>
                            <button type="button" class="dp-nav" id="next">›</button>
                        </div>
                        <div class="daynames">
                            <span>Su</span>
                            <span>Mo</span>
                            <span>Tu</span>
                            <span>We</span>
                            <span>Th</span>
                            <span>Fr</span>
                            <span>Sa</span>
                        </div>
                        <div class="days" id="days"></div>
                        <div class="picker-footer">
                            <button type="button" class="today" id="today">Today</button>
                            <button type="button" class="clear" id="clear">Clear</button>
                        </div>
                    </div>
                </div>

                <div>
                    <label for="taskPriority">Priority</label>
                    <select id="taskPriority" class="select-task">
                        <option class="pr-opt" value="low">Low</option>
                        <option class="pr-opt" value="medium">Medium</option>
                        <option class="pr-opt" value="high">High</option>
                    </select>
                </div>
                <button type="submit" class="add" id="add-btn">Add Task</button>
                <button class="other" style="height: 3rem;">Cancel</button>
            </form>
            <div class="tasks" id="tasks">
                <div class="small"><small id="text">Tasks appear here.</small></div>
            </div>
        </section>
    </main>
    <footer>all rights saved 2026</footer>
    
    <div class="overlay" id="overlay"></div>

    <script src="script.js"></script>
</body>
</html>
